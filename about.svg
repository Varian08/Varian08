<svg width="907" height="170" viewBox="0 0 907 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .line { opacity: 0; animation: fadeIn 2.2s ease-out forwards; }
  </style>
  <rect x="0.6" y="0.6" width="905.8" height="168.8" rx="6.1" stroke="#343434" stroke-width="1.2" />
  <text x="25" y="34" font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="18" font-weight="600" fill="#4f8cc9">About</text>
  <g font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="14.5" font-weight="400" font-style="italic" fill="#9e9e9e">
    <text x="25" y="64" class="line" style="animation-delay: 0.2s">I'm a Software Engineer.</text>
    <text x="25" y="86" class="line" style="animation-delay: 0.6s">I focus on problem-solving, system design, and delivering reliable software from database to UI.</text>
    <text x="25" y="108" class="line" style="animation-delay: 1s">I apply my knowledge, skills, and engineering discipline to get work done professionally and effectively,</text>
    <text x="25" y="130" class="line" style="animation-delay: 1.4s">taking full responsibility for what I build. Always eager to learn fast and pick up new technologies,</text>
    <text x="25" y="152" class="line" style="animation-delay: 1.8s">I strive to keep improving and create real value through my work.</text>
  </g>
</svg>
