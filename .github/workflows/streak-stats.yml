name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Varian08&theme=transparent&border=343434&border_radius=6.7&stroke=343434&ring=4f8cc9&fire=4f8cc9&currStreakNum=e6e6e6&currStreakLabel=6ea4d8&sideNums=4f8cc9&sideLabels=9e9e9e&dates=787878
          path: streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit updated streak.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git diff --staged --quiet || (git commit -m "chore: update streak stats" && git push)
