name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

concurrency:
  group: profile-stats-update
  cancel-in-progress: false

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Varian08&theme=transparent&border=343434&border_radius=6.7&stroke=343434&ring=4f8cc9&fire=6cb6ff&currStreakNum=c4c4c4&currStreakLabel=6ea4d8&sideNums=4f8cc9&sideLabels=9e9e9e&dates=787878
          path: streak.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.STREAK_STATS_TOKEN }}

      - name: Add ambient glow and fire pulse animation
        run: |
          node -e '
            const fs = require("fs");
            let svg = fs.readFileSync("streak.svg", "utf8");
            const css = `
              @keyframes ringGlow {
                0%, 100% { filter: drop-shadow(0 0 1px rgba(79, 140, 201, 0.12)); }
                50% { filter: drop-shadow(0 0 3px rgba(79, 140, 201, 0.32)); }
              }
              @keyframes firePulse {
                0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(79, 140, 201, 0.2)); }
                50% { transform: scale(1.04); filter: drop-shadow(0 0 4px rgba(108, 182, 255, 0.5)); }
              }
            `;
            svg = svg.replace("</style>", css + "\n        </style>");
            svg = svg.replace(
              "animation: fadein 0.5s linear forwards 0.4s",
              "animation: fadein 0.5s linear forwards 0.4s, ringGlow 4s ease-in-out infinite 0.9s"
            );
            svg = svg.replace(
              "fill=\x27#6cb6ff\x27 stroke-opacity=\x270\x27/>",
              "fill=\x27#6cb6ff\x27 stroke-opacity=\x270\x27 style=\x27transform-box: fill-box; transform-origin: center; animation: firePulse 3s ease-in-out infinite;\x27/>"
            );
            fs.writeFileSync("streak.svg", svg, "utf8");
          '

      - name: Commit updated streak.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git diff --staged --quiet || (git commit -m "chore: update streak stats" && git pull --rebase origin main && git push)
