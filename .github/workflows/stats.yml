name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stats.yml"
      - ".github/scripts/generate-stats.mjs"

concurrency:
  group: profile-stats-update
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate stats.svg (2026, 2025, 2024)
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.STREAK_STATS_TOKEN }}
          GITHUB_USERNAME: Varian08
        run: |
          OUTPUT_PATH=stats.svg node .github/scripts/generate-stats.mjs
          STATS_YEAR=2025 OUTPUT_PATH=stats-2025.svg node .github/scripts/generate-stats.mjs
          STATS_YEAR=2024 OUTPUT_PATH=stats-2024.svg node .github/scripts/generate-stats.mjs

      - name: Commit updated stats SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg stats-2025.svg stats-2024.svg
          git diff --staged --quiet || (git commit -m "chore: update github stats" && git pull --rebase origin main && git push)
