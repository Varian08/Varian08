name: Update Most Used Languages

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/top-langs.yml"
      - ".github/scripts/generate-top-langs.mjs"

jobs:
  update-top-langs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate top-langs.svg from authored commits
        env:
          GITHUB_TOKEN: ${{ secrets.STREAK_STATS_TOKEN }}
          GITHUB_USERNAME: Varian08
          OUTPUT_PATH: top-langs.svg
        run: node .github/scripts/generate-top-langs.mjs

      - name: Commit updated top-langs.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-langs.svg
          git diff --staged --quiet || (git commit -m "chore: update top-langs stats" && git push)
